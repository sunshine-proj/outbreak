[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/Outbreak.OutbreakGameMode
; Interim maps until the project's own test map exists (ROADMAP 0.2 "Create initial playable map").
; Template_Default is the engine's basic level (floor, lighting, sky). Replace once /Game/Levels exists.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default

[/Script/NavigationSystem.RecastNavMesh]
; Phase 12: doors switch their navigation area at runtime (locked = impassable to AI), which needs
; dynamic modifiers. Level geometry stays baked. A RecastNavMesh actor already saved in a level
; keeps its own value; check it in the level's RecastNavMesh-Default details.
RuntimeGeneration=DynamicModifiersOnly

[/Script/Engine.Engine]
; Phase 14 settings persistence: player settings (look sensitivity, invert, field of view, subtitles)
; extend the engine's user settings and are saved with them in GameUserSettings.ini.
GameUserSettingsClassName=/Script/Outbreak.OutbreakGameUserSettings
